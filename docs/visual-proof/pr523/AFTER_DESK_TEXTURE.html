<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk-texture AFTER</title>
<style>
body { margin: 0; font-family: system-ui, sans-serif; }
.scene {
  min-height: 100vh;
  /* NEW desk-texture — marine-cool parchment with detectable map depth */
  background-image:
    radial-gradient(120% 72% at 50% -16%, rgba(44,58,79,0.14) 0%, rgba(44,58,79,0) 60%),
    radial-gradient( 60% 52% at  6% 18%, rgba(197,148,77,0.11) 0%, rgba(197,148,77,0) 58%),
    radial-gradient( 50% 42% at 96% 82%, rgba(110,106,74,0.08) 0%, rgba(110,106,74,0) 55%),
    linear-gradient(180deg, #eee8da 0%, #e8e0ce 55%, #e2d8c4 100%);
  padding: 3rem 4rem;
}
h1 { color: #1E1A14; font-size: 1.75rem; margin: 0 0 0.5rem; }
p  { color: #4A4338; margin: 0 0 2rem; }
.card { background: white; border: 1px solid rgba(44,58,79,0.12); border-radius: 1rem; padding: 1.5rem; margin-bottom: 0.75rem; max-width: 700px; box-shadow: 0 2px 10px rgba(30,26,20,0.08); }
</style>
</head>
<body>
<div class="scene">
  <h1>Tokyo Summer 2025</h1>
  <p>Journey Desk · Jul 12 – Jul 28</p>
  <div class="card">Day 1 — Arrival in Shinjuku</div>
  <div class="card">Day 2 — Meiji Shrine & Harajuku</div>
  <div class="card">Day 3 — Akihabara & teamLab</div>
</div>
</body>
</html>
