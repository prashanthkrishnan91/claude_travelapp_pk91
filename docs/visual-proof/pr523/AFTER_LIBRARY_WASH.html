<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library-wash AFTER</title>
<style>
body { margin: 0; font-family: system-ui, sans-serif; }
.scene {
  min-height: 100vh;
  /* NEW library-wash gradient — warm honey paper with visible depth */
  background-image:
    radial-gradient(92% 52% at 50% -4%,  rgba(197,148,77,0.28) 0%, rgba(197,148,77,0) 56%),
    radial-gradient(72% 54% at 88%  3%,  rgba(110,106,74,0.18) 0%, rgba(110,106,74,0) 60%),
    radial-gradient(80% 60% at  6% 98%,  rgba(181,105,75,0.12) 0%, rgba(181,105,75,0) 65%),
    linear-gradient(180deg, #f5edd8 0%, #ede0c6 48%, #e6d8b8 100%);
  padding: 3rem 4rem;
}
h1 { color: #1E1A14; font-size: 2rem; margin: 0 0 0.5rem; }
p  { color: #4A4338; margin: 0 0 2rem; }
.card { background: white; border: 1px solid rgba(197,148,77,0.22); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 4px 16px rgba(30,20,10,0.10); max-width: 600px; }
.card h2 { margin: 0 0 0.5rem; font-size: 1.125rem; color: #1E1A14; }
.card p  { margin: 0; color: #4A4338; font-size: 0.875rem; }
</style>
</head>
<body>
<div class="scene">
  <h1>My Journeys</h1>
  <p>The Folio Library</p>
  <div class="card">
    <h2>Tokyo Summer 2025</h2>
    <p>Jul 12 – Jul 28 · Planned</p>
  </div>
  <div class="card">
    <h2>Amalfi Coast Spring</h2>
    <p>May 3 – May 14 · Researching</p>
  </div>
</div>
</body>
</html>
