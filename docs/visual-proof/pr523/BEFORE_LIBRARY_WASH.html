<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library-wash BEFORE</title>
<style>
body { margin: 0; font-family: system-ui, sans-serif; }
.scene {
  min-height: 100vh;
  /* OLD library-wash gradient — near-flat beige, barely visible depth */
  background-image:
    radial-gradient(90% 45% at 50% -6%, rgba(197,148,77,0.10) 0%, rgba(197,148,77,0) 60%),
    radial-gradient(70% 50% at 88% 4%, rgba(110,106,74,0.07) 0%, rgba(110,106,74,0) 62%),
    linear-gradient(180deg, #faf7f0 0%, #f3eee2 52%, #ece4d2 100%);
  padding: 3rem 4rem;
}
h1 { color: #1E1A14; font-size: 2rem; margin: 0 0 0.5rem; }
p  { color: #4A4338; margin: 0 0 2rem; }
.card { background: white; border: 1px solid rgba(197,148,77,0.18); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.08); max-width: 600px; }
.card h2 { margin: 0 0 0.5rem; font-size: 1.125rem; color: #1E1A14; }
.card p  { margin: 0; color: #4A4338; font-size: 0.875rem; }
</style>
</head>
<body>
<div class="scene">
  <h1>My Journeys</h1>
  <p>The Folio Library</p>
  <div class="card">
    <h2>Tokyo Summer 2025</h2>
    <p>Jul 12 – Jul 28 · Planned</p>
  </div>
  <div class="card">
    <h2>Amalfi Coast Spring</h2>
    <p>May 3 – May 14 · Researching</p>
  </div>
</div>
</body>
</html>
